name: Bug Report
description: Report a bug or issue you've encountered
title: "[BUG] "
labels: ["bug"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please fill out the form below to help us resolve the issue.

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which component is affected?
      options:
        - Backend (FastAPI)
        - Frontend (React)
        - Emotion Detection
        - Crisis Management
        - Screening
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Clear and concise description of what the bug is
      placeholder: "The bug occurs when..."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen instead?
      placeholder: "Should display..."
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots/Logs
      description: Add screenshots or error logs if applicable
      placeholder: "Paste error logs or attach screenshots"

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Tell us about your setup
      placeholder: |
        - OS: [e.g. Windows 10, macOS, Ubuntu]
        - Python version: [e.g. 3.9]
        - Node version: [e.g. 16.0]
        - Browser: [e.g. Chrome, Firefox]
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context or relevant information
      placeholder: "Any other details..."
